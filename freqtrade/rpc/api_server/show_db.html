<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freqtrade DB Viewer</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
    <style>
        .v-application { background-color: #121212 !important; }
        .sql-editor {
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: #1e1e1e !important;
            color: #d4d4d4 !important;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            width: 100%;
            min-height: 150px;
            outline: none;
        }
        .sql-editor:focus { border-color: #2196F3; }
        .result-table { background-color: #1e1e1e !important; }
        .result-table th { color: #2196F3 !important; text-transform: uppercase; font-size: 0.8rem; }
        .error-msg { color: #ff5252; font-family: monospace; white-space: pre-wrap; background: #2a1212; padding: 10px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <v-app>
            <v-main>
                <v-container fluid>
                    <v-row>
                        <v-col cols="12">
                            <v-card dark elevation="4" class="pa-4">
                                <v-card-title class="headline blue--text text--lighten-2">
                                    <v-icon left color="blue">mdi-database</v-icon>
                                    Database Viewer
                                    <v-spacer></v-spacer>
                                    <v-btn small text color="grey" @click="showLogin = true">
                                        <v-icon left small>mdi-lock-reset</v-icon> Сменить пароль
                                    </v-btn>
                                </v-card-title>

                                <v-row class="mt-4">
                                    <v-col cols="12" md="3">
                                        <v-select
                                            v-model="selectedDb"
                                            :items="dbList"
                                            label="Select Database"
                                            outlined
                                            dense
                                            prepend-inner-icon="mdi-database-outline"
                                            @change="onDbChange"
                                        ></v-select>
                                    </v-col>
                                    <v-col cols="12" md="3">
                                        <v-select
                                            v-model="selectedTable"
                                            :items="tableList"
                                            label="Select Table"
                                            outlined
                                            dense
                                            prepend-inner-icon="mdi-table"
                                            :disabled="tableList.length === 0"
                                            @change="onTableChange"
                                        ></v-select>
                                    </v-col>
                                    <v-col cols="12" md="2">
                                        <v-text-field
                                            v-model="limit"
                                            label="Rows Limit"
                                            type="number"
                                            outlined
                                            dense
                                        ></v-text-field>
                                    </v-col>
                                    <v-col cols="12" md="4" class="text-right">
                                        <v-btn color="blue darken-2" @click="executeQuery" :loading="loading" :disabled="!selectedDb">
                                            <v-icon left>mdi-play</v-icon> Execute SQL
                                        </v-btn>
                                    </v-col>
                                </v-row>

                                <textarea 
                                    v-model="sqlQuery" 
                                    class="sql-editor mt-2" 
                                    placeholder="SELECT * FROM trades LIMIT 10..."
                                    spellcheck="false"
                                ></textarea>

                                <div v-if="error" class="error-msg">
                                    <v-icon small color="red" left>mdi-alert-circle</v-icon>
                                    {{ error }}
                                </div>
                            </v-card>
                        </v-col>
                    </v-row>

                    <v-row v-if="results.columns && results.columns.length > 0">
                        <v-col cols="12">
                            <v-card dark elevation="4">
                                <v-card-title class="subtitle-1">
                                    Results: {{ results.count }} rows
                                    <v-spacer></v-spacer>
                                    <v-btn icon small @click="copyToClipboard"><v-icon>mdi-content-copy</v-icon></v-btn>
                                </v-card-title>
                                <v-simple-table dense class="result-table">
                                    <template v-slot:default>
                                        <thead>
                                            <tr>
                                                <th v-for="col in results.columns" :key="col">{{ col }}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="(row, i) in results.rows" :key="i">
                                                <td v-for="col in results.columns" :key="col">
                                                    {{ row[col] === null ? 'NULL' : row[col] }}
                                                </td>
                                            </tr>
                                        </tbody>
                                    </template>
                                </v-simple-table>
                            </v-card>
                        </v-col>
                    </v-row>
                </v-container>

                <v-dialog v-model="showLogin" max-width="400" persistent>
                    <v-card dark>
                        <v-card-title>Авторизация</v-card-title>
                        <v-card-text>
                            Для доступа к БД введите логин и пароль от FreqUI.
                            <v-text-field v-model="manualUser" label="Логин" outlined dense class="mt-4"></v-text-field>
                            <v-text-field v-model="manualPass" label="Пароль" type="password" outlined dense></v-text-field>
                        </v-card-text>
                        <v-card-actions>
                            <v-spacer></v-spacer>
                            <v-btn color="blue" @click="doManualLogin">Войти</v-btn>
                        </v-card-actions>
                    </v-card>
                </v-dialog>
            </v-main>
        </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script>
        let ftToken = '';

        async function silentLogin(u, p) {
            let username = u || 'freqtrade', password = p;
            if (!password) {
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const val = localStorage.getItem(localStorage.key(i));
                        if (!val) continue;
                        try {
                            const parsed = JSON.parse(val);
                            if (parsed && parsed.openAPIPassword) { password = parsed.openAPIPassword; username = parsed.username || 'freqtrade'; break; }
                            if (parsed && parsed.auth && parsed.auth.password) { password = parsed.auth.password; username = parsed.auth.username || 'freqtrade'; break; }
                        } catch (e) {}
                    }
                } catch (e) {}
            }
            if (!password) return false;
            try {
                const res = await fetch('/api/v1/token/login', {
                    method: 'POST',
                    headers: { 'Authorization': 'Basic ' + btoa(username + ':' + password) }
                });
                if (res.ok) {
                    const data = await res.json();
                    ftToken = data.access_token;
                    localStorage.setItem('ft_manual_token', ftToken);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        async function apiFetch(url, options = {}) {
            if (!ftToken) ftToken = localStorage.getItem('ft_manual_token') || '';
            options.headers = { ...(options.headers || {}), 'Authorization': `Bearer ${ftToken}` };
            let res = await fetch(url, options);
            if (res.status === 401) {
                const loginOk = await silentLogin();
                if (loginOk) {
                    options.headers['Authorization'] = `Bearer ${ftToken}`;
                    res = await fetch(url, options);
                } else {
                    window.dispatchEvent(new CustomEvent('ft-unauthorized'));
                }
            }
            return res;
        }

        const vm = new Vue({
            el: '#app',
            vuetify: new Vuetify(),
            data: {
                showLogin: false,
                manualUser: 'freqtrade',
                manualPass: '',
                loading: false,
                dbList: [],
                tableList: [],
                selectedDb: '',
                selectedTable: '',
                sqlQuery: 'SELECT * FROM trades LIMIT 10',
                limit: 50,
                error: null,
                results: { columns: [], rows: [], count: 0 }
            },
            mounted() {
                window.addEventListener('ft-unauthorized', () => { this.showLogin = true; });
                this.init();
            },
            methods: {
                async init() {
                    ftToken = localStorage.getItem('ft_manual_token') || '';
                    if (!ftToken) await silentLogin();
                    await this.fetchDbList();
                },
                async doManualLogin() {
                    const ok = await silentLogin(this.manualUser, this.manualPass);
                    if (ok) {
                        this.showLogin = false;
                        this.error = null;
                        await this.fetchDbList();
                    } else {
                        alert('Ошибка входа. Проверьте логин и пароль.');
                    }
                },
                async fetchDbList() {
                    try {
                        const response = await apiFetch('/api/v1/db_list');
                        if (!response.ok) {
                            if (response.status === 401) return;
                            const errData = await response.json().catch(() => ({}));
                            this.error = "API Error: " + (errData.detail || response.statusText);
                            return;
                        }
                        this.dbList = await response.json();
                        if (this.dbList.length > 0 && !this.selectedDb) {
                            this.selectedDb = this.dbList.find(d => d.includes('trades')) || this.dbList[0];
                            await this.onDbChange();
                        }
                    } catch (e) {
                        this.error = "Failed to fetch DB list: " + e;
                    }
                },
                async onDbChange() {
                    this.tableList = [];
                    this.selectedTable = '';
                    try {
                        const response = await apiFetch('/api/v1/db_tables', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ db: this.selectedDb })
                        });
                        if (response.ok) {
                            this.tableList = await response.json();
                            this.loadLastQuery();
                        }
                    } catch (e) {}
                },
                onTableChange() {
                    if (this.selectedTable) {
                        this.sqlQuery = `SELECT * FROM ${this.selectedTable} LIMIT ${this.limit}`;
                    }
                },
                async executeQuery() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const response = await apiFetch('/api/v1/db_query', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ db: this.selectedDb, sql: this.sqlQuery })
                        });
                        const data = await response.json();
                        if (data.error) {
                            this.error = data.error;
                            this.results = { columns: [], rows: [], count: 0 };
                        } else {
                            this.results = data;
                            localStorage.setItem('last_sql_' + this.selectedDb, this.sqlQuery);
                        }
                    } catch (e) {
                        this.error = "Query failed: " + e;
                    } finally {
                        this.loading = false;
                    }
                },
                loadLastQuery() {
                    const saved = localStorage.getItem('last_sql_' + this.selectedDb);
                    if (saved) {
                        this.sqlQuery = saved;
                    } else if (this.tableList.length > 0) {
                        this.selectedTable = this.tableList.find(t => t === 'trades' || t === 'ingest_queue') || this.tableList[0];
                        this.onTableChange();
                    }
                },
                copyToClipboard() {
                    const text = JSON.stringify(this.results.rows, null, 2);
                    navigator.clipboard.writeText(text);
                    alert('Copied!');
                }
            }
        });
    </script>
</body>
</html>
